<html>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content=width=device-width, initial-scale=1.0>
    <title>Simple Table</title>
</head>

<body>

    <h1>Student Details</h1>

    <table border=1>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>Delhi</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>22</td>
            <td>Mumbai</td>
        </tr>

        <tr>
            <td>Amit</td>
            <td>21</td>
            <td>Ahmedabad</td>
        </tr>
    </table>

</body>
</html>
